services:
  - type: web
    name: out-cricket-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./start-render.sh
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        value: https://out-khaki-pi.vercel.app
      - key: ALLOWED_HOSTS
        value: out-khaki-pi.vercel.app,localhost,127.0.0.1
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: out-cricket-db
          property: connectionString
    buildFilter:
      paths:
        - backend/**
        - render.yaml

databases:
  - name: out-cricket-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: out_cricket
    user: out_cricket
    ipAllowList: []
